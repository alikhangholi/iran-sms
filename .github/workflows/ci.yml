name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies via yarn
        run: yarn install --frozen-lockfile
        timeout-minutes: 10

      - name: Typecheck
        run: yarn tsc --noEmit

      - name: Lint
        run: yarn eslint src tests

      - name: Format check
        run: yarn prettier --check "src/**/*.ts" "tests/**/*.ts" --ignore-unknown

      - name: Build
        run: yarn tsup

      - name: Test
        run: yarn jest --coverage

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-node-20
          path: coverage/
