name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install --foreground-scripts; exit 0
        timeout-minutes: 10
      - name: Typecheck
        run: node_modules/.bin/tsc --noEmit
      - name: Lint
        run: node_modules/.bin/eslint src tests
      - name: Format check
        run: node_modules/.bin/prettier --check "src/**/*.ts" "tests/**/*.ts" --ignore-unknown
      - name: Build
        run: node_modules/.bin/tsup
      - name: Test
        run: node_modules/.bin/jest --coverage

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-node-${{ matrix.node-version }}
          path: coverage/
