# REQUIRED: Set NPM_TOKEN in GitHub repo Settings → Secrets → Actions
# NPM_TOKEN = Automation token from npmjs.org account settings
# Publish triggers on git tag push: git tag v1.0.x && git push origin v1.0.x
name: Publish
on:
  push:
    tags:
      - 'v*.*.*'
permissions:
  id-token: write
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
      - name: Install dependencies via yarn
        run: yarn install --frozen-lockfile
        timeout-minutes: 10
      - name: Build
        run: yarn tsup
      - name: Test
        run: yarn jest
      - name: Publish to npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
