# REQUIRED: Set NPM_TOKEN in GitHub repo Settings → Secrets → Actions
# NPM_TOKEN = Automation token from npmjs.org account settings
# Publish triggers automatically when you push a git tag: git tag v1.0.0 && git push origin v1.0.0

name: Publish

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    if: >
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'v')

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies via yarn
        run: yarn install --frozen-lockfile
        timeout-minutes: 10

      - name: Build
        run: yarn tsup

      - name: Test
        run: yarn jest

      - name: Publish to npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
